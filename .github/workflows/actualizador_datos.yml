name: 🤖 Actualizador de Datos Financieros

on:
  schedule:
    - cron: '0 14,17,20 * * 1-5'
  workflow_dispatch:

jobs:
  actualizar-json:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write 

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v3

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 Instalar librerías
        run: |
          pip install requests beautifulsoup4 pandas yfinance

      - name: 🚀 Ejecutar Scraper
        run: python scripts/scraper_crítico.py

      - name: 💾 Guardar y Subir
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add datos_criticos.json
          git commit -m "⚡ Update automático de datos_criticos.json" || echo "No hay cambios nuevos"
          git push
